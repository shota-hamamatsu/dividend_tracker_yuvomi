# Example setup: yuvomi + the dividend tracker sidecar + Caddy (reverse proxy).
# This is yuvomi's official docker-compose.yml with dividend-tracker and caddy added.
# Browsers connect only to Caddy. /api/extensions/dividend-tracker/* goes to the sidecar
# and everything else to yuvomi (so both share one origin).
services:
    yuvomi:
        image: ghcr.io/ulsklyc/yuvomi:latest
        restart: unless-stopped
        env_file:
            - .env
        environment:
            - NODE_ENV=production
            - MODULES_DIR=/app/modules
        volumes:
            - ./data:/data
            - ./modules:/app/modules # put modules/dividend-tracker/ here
        # no published ports (reachable only through Caddy)

    dividend-tracker:
        build:
            context: ./dividend_tracker_yuvomi # where this repository is cloned
            dockerfile: server/Dockerfile
        restart: unless-stopped
        environment:
            - PUBLIC_ORIGIN=https://yuvomi.example.com # the URL opened in the browser (no trailing /)
            - YUVOMI_INTERNAL_URL=http://yuvomi:3000
        volumes:
            - ./dividend-data:/data # dividend data (records.json); back this up

    caddy:
        image: caddy:2
        restart: unless-stopped
        ports:
            - '80:80'
            - '443:443'
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
            - ./caddy-data:/data
